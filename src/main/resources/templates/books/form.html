<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Book - Library Management System' : 'Add New Book - Library Management System'}">Book Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
    <!-- Top Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">
        <!-- Flash Alerts Fragment -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb / Back Link -->
        <div class="mb-3">
            <a th:href="@{/books}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left"></i> Back to Book Catalog
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="content-card">
                    <div class="content-card-header">
                        <h5 class="content-card-title">
                            <i th:class="${isEdit ? 'bi bi-pencil-square text-primary' : 'bi bi-plus-circle text-primary'}"></i>
                            <span th:text="${isEdit ? 'Edit Book Details' : 'Add New Book to Catalog'}">Book Form</span>
                        </h5>
                    </div>

                    <div class="content-card-body">
                        <form th:action="${isEdit ? '/books/edit/' + bookId : '/books/save'}"
                              th:object="${bookDto}"
                              method="post">

                            <div class="row g-3">
                                <!-- ISBN -->
                                <div class="col-12 col-md-6">
                                    <label for="isbn" class="form-label">ISBN <span class="text-danger">*</span></label>
                                    <input type="text" id="isbn" th:field="*{isbn}" class="form-control"
                                           th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid' : ''"
                                           placeholder="e.g. 978-0134685991">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                                    <small class="text-muted">International Standard Book Number (unique)</small>
                                </div>

                                <!-- Category -->
                                <div class="col-12 col-md-6">
                                    <label for="category" class="form-label">Category / Genre <span class="text-danger">*</span></label>
                                    <input type="text" id="category" th:field="*{category}" list="categoryList" class="form-control"
                                           th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''"
                                           placeholder="e.g. Computer Science, Fiction, Physics">
                                    <datalist id="categoryList">
                                        <option th:each="cat : ${categories}" th:value="${cat}"></option>
                                    </datalist>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                                </div>

                                <!-- Title -->
                                <div class="col-12">
                                    <label for="title" class="form-label">Book Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" th:field="*{title}" class="form-control"
                                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                           placeholder="Full title of the book">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>

                                <!-- Author -->
                                <div class="col-12 col-md-6">
                                    <label for="author" class="form-label">Author Name <span class="text-danger">*</span></label>
                                    <input type="text" id="author" th:field="*{author}" class="form-control"
                                           th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''"
                                           placeholder="e.g. Joshua Bloch">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                                </div>

                                <!-- Publisher -->
                                <div class="col-12 col-md-6">
                                    <label for="publisher" class="form-label">Publisher</label>
                                    <input type="text" id="publisher" th:field="*{publisher}" class="form-control"
                                           placeholder="e.g. Addison-Wesley">
                                </div>

                                <!-- Publication Year -->
                                <div class="col-12 col-md-4">
                                    <label for="publicationYear" class="form-label">Publication Year</label>
                                    <input type="number" id="publicationYear" th:field="*{publicationYear}" class="form-control"
                                           min="1800" max="2099" placeholder="e.g. 2021">
                                </div>

                                <!-- Total Copies -->
                                <div class="col-12 col-md-4">
                                    <label for="totalCopies" class="form-label">Total Stock Copies <span class="text-danger">*</span></label>
                                    <input type="number" id="totalCopies" th:field="*{totalCopies}" class="form-control"
                                           th:classappend="${#fields.hasErrors('totalCopies')} ? 'is-invalid' : ''"
                                           min="1" placeholder="1">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('totalCopies')}" th:errors="*{totalCopies}"></div>
                                </div>

                                <!-- Available Copies -->
                                <div class="col-12 col-md-4">
                                    <label for="availableCopies" class="form-label">Available Copies <span class="text-danger">*</span></label>
                                    <input type="number" id="availableCopies" th:field="*{availableCopies}" class="form-control"
                                           th:classappend="${#fields.hasErrors('availableCopies')} ? 'is-invalid' : ''"
                                           min="0" placeholder="1">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('availableCopies')}" th:errors="*{availableCopies}"></div>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/books}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom d-flex align-items-center gap-2">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="${isEdit ? 'Save Changes' : 'Create Book'}">Save</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
