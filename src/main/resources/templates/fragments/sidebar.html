<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav id="appSidebar" class="app-sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-book-half"></i>
        <span>LibMaster Pro</span>
    </div>

    <div class="sidebar-nav">
        <div class="sidebar-heading">Main</div>
        <a th:href="@{/dashboard}" class="nav-link-custom" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>

        <div class="sidebar-heading">Catalog & Inventory</div>
        <a th:href="@{/books}" class="nav-link-custom" th:classappend="${activePage == 'books' ? 'active' : ''}">
            <i class="bi bi-collection"></i>
            <span>Manage Books</span>
        </a>
        <a th:href="@{/books/new}" class="nav-link-custom">
            <i class="bi bi-plus-circle"></i>
            <span>Add New Book</span>
        </a>

        <div class="sidebar-heading">Members</div>
        <a th:href="@{/members}" class="nav-link-custom" th:classappend="${activePage == 'members' ? 'active' : ''}">
            <i class="bi bi-people-fill"></i>
            <span>Manage Members</span>
        </a>
        <a th:href="@{/members/new}" class="nav-link-custom">
            <i class="bi bi-person-plus-fill"></i>
            <span>Register Member</span>
        </a>

        <div class="sidebar-heading">Circulation & Desk</div>
        <a th:href="@{/transactions/issue}" class="nav-link-custom" th:classappend="${activePage == 'issue' ? 'active' : ''}">
            <i class="bi bi-box-arrow-up-right"></i>
            <span>Issue Book</span>
        </a>
        <a th:href="@{/transactions/returns}" class="nav-link-custom" th:classappend="${activePage == 'returns' ? 'active' : ''}">
            <i class="bi bi-arrow-return-left"></i>
            <span>Return Books</span>
        </a>
        <a th:href="@{/transactions/overdue}" class="nav-link-custom" th:classappend="${activePage == 'overdue' ? 'active' : ''}">
            <i class="bi bi-exclamation-triangle-fill text-warning"></i>
            <span>Overdue Tracking</span>
        </a>
        <a th:href="@{/transactions}" class="nav-link-custom" th:classappend="${activePage == 'history' ? 'active' : ''}">
            <i class="bi bi-clock-history"></i>
            <span>Issue/Return History</span>
        </a>

        <div class="sidebar-heading">Analytics</div>
        <a th:href="@{/reports}" class="nav-link-custom" th:classappend="${activePage == 'reports' ? 'active' : ''}">
            <i class="bi bi-bar-chart-line-fill"></i>
            <span>Reports & Exports</span>
        </a>
    </div>
</nav>
</body>
</html>
