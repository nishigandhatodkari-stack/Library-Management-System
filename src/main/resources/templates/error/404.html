<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Record Not Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-4">

<div class="content-card text-center p-5" style="max-width: 520px; width: 100%;">
    <div class="text-warning mb-3" style="font-size: 4rem;">
        <i class="bi bi-question-circle"></i>
    </div>
    <h2 class="fw-bold mb-2">404 - Record Not Found</h2>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested book, member, or transaction could not be located in the library catalog.'}">
        The resource you are looking for does not exist.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-primary-custom">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
        <a th:href="@{/books}" class="btn btn-outline-secondary">
            <i class="bi bi-book me-1"></i> View Books
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
