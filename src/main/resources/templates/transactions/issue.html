<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book - Library Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
    <!-- Top Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">
        <!-- Flash Alerts Fragment -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb / Back Link -->
        <div class="mb-3">
            <a th:href="@{/dashboard}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="content-card">
                    <div class="content-card-header">
                        <h5 class="content-card-title">
                            <i class="bi bi-box-arrow-up-right text-primary"></i>
                            Issue Book to Member
                        </h5>
                    </div>

                    <div class="content-card-body">
                        <!-- Warning if no books or no members -->
                        <div th:if="${#lists.isEmpty(books)}" class="alert alert-warning mb-4">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <strong>No books currently available for issue.</strong>
                            All copies are either loaned out or not in stock.
                            <a th:href="@{/books/new}" class="alert-link">Add more copies</a>.
                        </div>

                        <div th:if="${#lists.isEmpty(members)}" class="alert alert-warning mb-4">
                            <i class="bi bi-person-exclamation me-2"></i>
                            <strong>No active members available.</strong>
                            <a th:href="@{/members/new}" class="alert-link">Register a new member</a> first.
                        </div>

                        <form th:action="@{/transactions/issue}" th:object="${issueRequest}" method="post">
                            <div class="row g-3">
                                <!-- Select Member -->
                                <div class="col-12">
                                    <label for="memberId" class="form-label">Select Borrower / Member <span class="text-danger">*</span></label>
                                    <select id="memberId" th:field="*{memberId}" class="form-select"
                                            th:classappend="${#fields.hasErrors('memberId')} ? 'is-invalid' : ''" required>
                                        <option value="">-- Choose Member --</option>
                                        <option th:each="m : ${members}"
                                                th:value="${m.id}"
                                                th:text="${m.fullName + ' (' + m.memberId + ' - ' + m.email + ')'}">
                                            Member Name
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                                </div>

                                <!-- Select Book -->
                                <div class="col-12">
                                    <label for="bookId" class="form-label">Select Available Book <span class="text-danger">*</span></label>
                                    <select id="bookId" th:field="*{bookId}" class="form-select"
                                            th:classappend="${#fields.hasErrors('bookId')} ? 'is-invalid' : ''" required>
                                        <option value="">-- Choose Book --</option>
                                        <option th:each="b : ${books}"
                                                th:value="${b.id}"
                                                th:text="${b.title + ' by ' + b.author + ' [' + b.availableCopies + ' available, ISBN: ' + b.isbn + ']'}">
                                            Book Title
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bookId')}" th:errors="*{bookId}"></div>
                                </div>

                                <!-- Issue Date -->
                                <div class="col-12 col-md-6">
                                    <label for="issueDate" class="form-label">Issue Date <span class="text-danger">*</span></label>
                                    <input type="date" id="issueDate" th:field="*{issueDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('issueDate')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></div>
                                </div>

                                <!-- Due Date -->
                                <div class="col-12 col-md-6">
                                    <label for="dueDate" class="form-label">Due Date <span class="text-danger">*</span></label>
                                    <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                                    <small class="text-muted">Standard borrowing period is 14 days</small>
                                </div>

                                <!-- Remarks -->
                                <div class="col-12">
                                    <label for="remarks" class="form-label">Notes / Remarks</label>
                                    <input type="text" id="remarks" th:field="*{remarks}" class="form-control"
                                           placeholder="e.g. Semester project loan, book in pristine condition">
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom d-flex align-items-center gap-2"
                                        th:disabled="${#lists.isEmpty(books) or #lists.isEmpty(members)}">
                                    <i class="bi bi-box-arrow-up-right"></i>
                                    <span>Confirm & Issue Book</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
