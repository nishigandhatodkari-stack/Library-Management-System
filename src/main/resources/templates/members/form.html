<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Member - Library Management System' : 'Register Member - Library Management System'}">Member Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
    <!-- Top Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">
        <!-- Flash Alerts Fragment -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb / Back Link -->
        <div class="mb-3">
            <a th:href="@{/members}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left"></i> Back to Members Directory
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="content-card">
                    <div class="content-card-header">
                        <h5 class="content-card-title">
                            <i th:class="${isEdit ? 'bi bi-person-gear text-primary' : 'bi bi-person-plus text-primary'}"></i>
                            <span th:text="${isEdit ? 'Edit Member Profile' : 'Register New Library Member'}">Member Form</span>
                        </h5>
                    </div>

                    <div class="content-card-body">
                        <form th:action="${isEdit ? '/members/edit/' + memberId : '/members/save'}"
                              th:object="${memberDto}"
                              method="post">

                            <div class="row g-3">
                                <!-- Member ID -->
                                <div class="col-12 col-md-6">
                                    <label for="memberId" class="form-label">Member ID / Card No <span class="text-danger">*</span></label>
                                    <input type="text" id="memberId" th:field="*{memberId}" class="form-control"
                                           th:classappend="${#fields.hasErrors('memberId')} ? 'is-invalid' : ''"
                                           placeholder="e.g. MEM-1005">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                                    <small class="text-muted">Unique institutional identification code</small>
                                </div>

                                <!-- Status -->
                                <div class="col-12 col-md-6">
                                    <label for="status" class="form-label">Membership Status</label>
                                    <select id="status" th:field="*{status}" class="form-select">
                                        <option value="ACTIVE">Active (Eligible to borrow books)</option>
                                        <option value="INACTIVE">Inactive (Borrowing suspended)</option>
                                    </select>
                                </div>

                                <!-- Full Name -->
                                <div class="col-12">
                                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                           placeholder="Member's full legal name">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <!-- Email -->
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           placeholder="member@university.edu">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <!-- Phone -->
                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                           placeholder="+91 9876543210">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <!-- Address -->
                                <div class="col-12">
                                    <label for="address" class="form-label">Residential / Campus Address</label>
                                    <textarea id="address" th:field="*{address}" class="form-control" rows="2"
                                              placeholder="Hostel / Room / Residential street address"></textarea>
                                </div>

                                <!-- Registration Date -->
                                <div class="col-12 col-md-6">
                                    <label for="registrationDate" class="form-label">Registration Date <span class="text-danger">*</span></label>
                                    <input type="date" id="registrationDate" th:field="*{registrationDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('registrationDate')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationDate')}" th:errors="*{registrationDate}"></div>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/members}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom d-flex align-items-center gap-2">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="${isEdit ? 'Save Changes' : 'Register Member'}">Save</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
