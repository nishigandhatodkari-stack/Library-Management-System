# ==============================================================================
# Library Management System - Application Configuration
# ==============================================================================
spring.application.name=library-management-system
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection (Supports Environment Variable Overrides)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password26}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ------------------------------------------------------------------------------
# Business Logic Configuration
# ------------------------------------------------------------------------------
# Default loan period in days
app.library.loan-period-days=14
# Daily overdue fine in currency units (optional feature / display)
app.library.daily-fine-rate=2.0

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.library=DEBUG
logging.level.org.springframework.security=INFO
